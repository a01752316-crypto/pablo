<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>César Omar Oliver Villalobos | Perfil de Integrante</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0b1120',          /* Fondo azul oscuro profundo */
                            card: '#131c31',        /* Tarjetas azul marino */
                            cardHover: '#1a2642',
                            accent: '#3b82f6',      /* Azul brillante primario */
                            accentHover: '#2563eb',
                            border: '#2e3d5c',      /* Bordes suaves */
                            textMuted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js para el Gráfico de Radar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        /* Efectos de resplandor para tarjetas */
        .glow-card {
            box-shadow: 0 0 25px -5px rgba(59, 130, 246, 0.08);
            border: 1px solid #2e3d5c;
            transition: all 0.3s ease;
        }
        
        .glow-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 30px -2px rgba(59, 130, 246, 0.25);
        }

        /* Barra de desplazamiento personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1120;
        }
        ::-webkit-scrollbar-thumb {
            background: #2e3d5c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }

    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Header / Barra Superior con Botón de Retorno -->
    <header class="w-full border-b border-brand-border/60 bg-brand-bg/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <!-- Botón para volver al equipo general -->
            <a href="../../index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-brand-textMuted hover:text-brand-accent transition-colors py-2 px-3 rounded-xl hover:bg-brand-card">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Volver al equipo</span>
            </a>

            <div class="text-xs text-brand-textMuted font-medium hidden sm:block">
                Perfil de Integrante
            </div>
        </div>
    </header>

    <!-- Contenido Principal del Perfil Individual -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 py-10 space-y-12">

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-brand-border/60 py-6 bg-brand-bg mt-12">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <p class="text-xs text-brand-textMuted">
                Perfil de Integrante · Proyecto Colaborativo 2026
            </p>
        </div>
    </footer>

</body>
</html>
